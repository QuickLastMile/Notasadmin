<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXA — Centro de Gestión</title>
<meta name="description" content="NEXA · Centro de Gestión: caja menor, tareas, novedades, proyectos y clientes.">
<meta name="theme-color" content="#800000" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#160C0A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NEXA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest?v=35">

<link rel="icon" type="image/png" href="assets/nexa-app-icon-192.png?v=35">
<link rel="apple-touch-icon" href="assets/nexa-app-icon-192.png?v=35">

<!-- Adelanta el saludo TLS a Supabase y al CDN: ahorra ~200 ms en la primera carga -->
<link rel="preconnect" href="https://jxfyiqisrnexjocqwicx.supabase.co" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

<!-- Sube ?v= en cada despliegue para que nadie quede con CSS/JS viejo en caché -->
<link rel="stylesheet" href="css/styles.css?v=40">

<!-- El tema se aplica antes de pintar, para que no haya un destello blanco -->
<script>
  document.documentElement.setAttribute('data-theme',
    localStorage.getItem('hub_theme') ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
</script>
</head>
<body>

<!-- ══ Pantalla de carga: aparece de inmediato, sin esperar el JS ══════════ -->
<div id="splash">
  <div class="splash-logo">
    <svg viewBox="0 0 100 100" width="60" height="60" aria-label="NEXA">
      <path d="M16 11H39L67 79H44Z" fill="#8E2E4E"/>
      <path d="M16 29H38V70Q38 80 28 80H16Z" fill="#6E1A38"/>
      <path d="M62 11H84V46Z" fill="#D9A03A"/>
      <path d="M67 48H84V80H67Z" fill="#6E1A38"/>
    </svg>
  </div>
  <div class="splash-txt">NEXA</div>
  <div class="splash-sub">Centro de Gestión</div>
  <div class="splash-bar"><span></span></div>
</div>

<div id="app" hidden>
  <!-- ══ Barra lateral (escritorio) ══════════════════════════ -->
  <aside id="side">
    <div class="brand">
      <div class="brand-logo" id="brandLogo"></div>
      <div class="brand-txt"><strong>NEXA</strong><span>Centro de Gestión</span></div>
      <button class="side-toggle" id="sideToggle" onclick="toggleBarra()"
              title="Contraer barra lateral" aria-label="Contraer barra lateral"></button>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <!-- ══ Contenido ══════════════════════════════════════════ -->
  <main>
    <div class="capture">
      <button class="menu-btn" onclick="abrirMas()" title="Menú">☰</button>
      <div class="capture-box">
        <span class="capture-ico">⚡</span>
        <input id="cap" autocomplete="off"
               placeholder="Captura rápida:  t: llamar a Cafam mañana !alta">
        <span class="capture-hint">Enter ↵</span>
        <div class="preview" id="prev"></div>
      </div>
      <div class="notif-top" id="notifTop"></div>
      <div class="hoy"><b id="hoyTxt"></b><span id="hoySub"></span></div>
    </div>
    <div class="wrap" id="view"></div>
  </main>
</div>

<!-- ══ Barra inferior (celular) ══════════════════════════════ -->
<nav class="tabbar" id="tabbar"></nav>

<!-- ══ Hoja inferior "Más" ═══════════════════════════════════ -->
<div class="sheet-mask" id="sheetMask" onclick="cerrarSheet()"></div>
<div class="sheet" id="sheet"></div>
<aside class="notif-panel" id="notifPanel" aria-hidden="true"></aside>

<div class="mask" id="mask" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<!-- NEXA — asistente contextual. El contenido se crea desde js/nexa.js. -->
<section class="nexa-chat" id="nexaChat" aria-label="Asistente NEXA" aria-hidden="true"></section>
<button class="nexa-fab" id="nexaFab" type="button" onclick="toggleNexa()"
        aria-label="Abrir asistente NEXA" title="Hablar con NEXA">
  <span class="nexa-orbita nexa-orbita-uno" aria-hidden="true"></span>
  <span class="nexa-orbita nexa-orbita-dos" aria-hidden="true"></span>
  <img class="nexa-mascota-fab" src="assets/nexa-bot/nexa-mascota-flotante-v2.png" alt="">
  <span class="nexa-saludo-fab" id="nexaSaludoFab">¿Qué revisamos?</span>
  <span class="nexa-fab-dot" aria-hidden="true"></span>
</button>

<!-- ══════════════════════════════════════════════════════════
     Todos los scripts van con `defer`: se descargan en paralelo
     y se ejecutan en orden al terminar de leer el HTML. Sin esto,
     cada uno bloqueaba al siguiente y la carga tardaba ~6 s.
     ══════════════════════════════════════════════════════════ -->
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script defer src="js/config.js?v=26"></script>
<script defer src="js/utils.js?v=26"></script>
<script defer src="js/iconos.js?v=26"></script>
<script defer src="js/listas.js?v=30"></script>
<script defer src="js/eventos.js?v=26"></script>
<script defer src="js/nube.js?v=36"></script>
<script defer src="js/db.js?v=26"></script>
<script defer src="js/seed.js?v=26"></script>
<script defer src="js/store.js?v=32"></script>
<script defer src="js/ui.js?v=27"></script>
<script defer src="js/tabla.js?v=26"></script>
<script defer src="js/archivos.js?v=27"></script>
<script defer src="js/proyecto-archivos.js?v=2"></script>
<script defer src="js/capture.js?v=26"></script>
<script defer src="js/acciones.js?v=35"></script>
<script defer src="js/acciones-caja.js?v=26"></script>
<script defer src="js/acciones-preguntas.js?v=30"></script>
<script defer src="js/acciones-eventos.js?v=26"></script>
<script defer src="js/ficha-tarea.js?v=26"></script>
<script defer src="js/ficha-novedad.js?v=26"></script>
<script defer src="js/formularios.js?v=37"></script>
<script defer src="js/formulario-publico.js?v=30"></script>
<script defer src="js/ficha-proyecto.js?v=40"></script>
<script defer src="js/google-workspace.js?v=38"></script>
<script defer src="js/notificaciones.js?v=35"></script>
<script defer src="js/nexa.js?v=3"></script>

<script defer src="js/views/inicio.js?v=26"></script>
<script defer src="js/views/tareas.js?v=26"></script>
<script defer src="js/views/calendario.js?v=26"></script>
<script defer src="js/views/caja.js?v=26"></script>
<script defer src="js/views/novedades.js?v=26"></script>
<script defer src="js/views/proyectos.js?v=26"></script>
<script defer src="js/views/clientes.js?v=26"></script>
<script defer src="js/views/enlaces.js?v=30"></script>
<script defer src="js/views/notificaciones.js?v=33"></script>
<script defer src="js/views/config.js?v=38"></script>

<script defer src="js/app.js?v=38"></script>
</body>
</html>
