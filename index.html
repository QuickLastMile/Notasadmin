<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hub Personal — Centro de Control</title>
<meta name="description" content="Centro de control diario: tareas, caja menor, novedades, proyectos y clientes.">
<meta name="theme-color" content="#6E2142" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#150B10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍷</text></svg>">

<!-- Sube ?v= en cada despliegue para que nadie quede con CSS/JS viejo en caché -->
<link rel="stylesheet" href="css/styles.css?v=11">
</head>
<body>

<div id="app">
  <!-- ══ Barra lateral (escritorio) ══════════════════════════ -->
  <aside id="side">
    <div class="brand">
      <div class="brand-mark">HP</div>
      <div class="brand-txt"><strong>Hub Personal</strong><span>Centro de control</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button onclick="toggleTheme()" id="themeBtn">🌙 Tema</button>
      <button onclick="cargarEjemplo()" title="Reemplaza todo por datos de ejemplo">◔ Ejemplo</button>
      <button onclick="vaciarTodo()" title="Borra todos tus datos">🗑 Vaciar</button>
    </div>
  </aside>

  <!-- ══ Contenido ══════════════════════════════════════════ -->
  <main>
    <div class="capture">
      <button class="menu-btn" onclick="abrirMas()" title="Menú">☰</button>
      <div class="capture-box">
        <span class="capture-ico">⚡</span>
        <input id="cap" autocomplete="off"
               placeholder="Captura rápida:  t: llamar a Cafam mañana !alta">
        <span class="capture-hint">Enter ↵</span>
        <div class="preview" id="prev"></div>
      </div>
      <div class="hoy"><b id="hoyTxt"></b><span id="hoySub"></span></div>
    </div>
    <div class="wrap" id="view"></div>
  </main>
</div>

<!-- ══ Barra inferior (celular) ══════════════════════════════ -->
<nav class="tabbar" id="tabbar"></nav>

<!-- ══ Hoja inferior "Más" ═══════════════════════════════════ -->
<div class="sheet-mask" id="sheetMask" onclick="cerrarSheet()"></div>
<div class="sheet" id="sheet"></div>

<div class="mask" id="mask" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<!-- ══ Supabase (solo hace algo si hay credenciales en config) ══ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- ══ Núcleo ═══════════════════════════════════════════════ -->
<script src="js/config.js?v=11"></script>
<script src="js/utils.js?v=11"></script>
<script src="js/listas.js?v=11"></script>
<script src="js/nube.js?v=11"></script>
<script src="js/db.js?v=11"></script>
<script src="js/seed.js?v=11"></script>
<script src="js/store.js?v=11"></script>
<script src="js/ui.js?v=11"></script>
<script src="js/archivos.js?v=11"></script>
<script src="js/capture.js?v=11"></script>
<script src="js/acciones.js?v=11"></script>
<script src="js/acciones-caja.js?v=11"></script>

<!-- ══ Vistas (una por módulo — se editan de forma independiente) ══ -->
<script src="js/views/inicio.js?v=11"></script>
<script src="js/views/tareas.js?v=11"></script>
<script src="js/views/caja.js?v=11"></script>
<script src="js/views/novedades.js?v=11"></script>
<script src="js/views/proyectos.js?v=11"></script>
<script src="js/views/clientes.js?v=11"></script>
<script src="js/views/enlaces.js?v=11"></script>
<script src="js/views/config.js?v=11"></script>

<!-- ══ Arranque ═════════════════════════════════════════════ -->
<script src="js/app.js?v=11"></script>
</body>
</html>
